# Directus and PostgreSQL in production (Coolify, Docker Compose build pack, base directory `/directus`).
# The values come from the variables set in Coolify; SERVICE_* are generated by Coolify.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: directus
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "directus", "-d", "directus"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    build: .
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/directus/uploads
    environment:
      SERVICE_FQDN_DIRECTUS_8055: ""
      PUBLIC_URL: ${SERVICE_URL_DIRECTUS}
      SECRET: ${SERVICE_BASE64_64_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      CORS_ENABLED: "true"
      # the site's domains, comma-separated
      CORS_ORIGIN: ${CORS_ORIGIN}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-info@leicaflorianrobert.dev}
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
      DEPLOY_WEBHOOK_TOKEN: ${DEPLOY_WEBHOOK_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@leicaflorianrobert.dev}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-2525}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      # the variables flows can read with {{ $env.NAME }}
      FLOWS_ENV_ALLOW_LIST: DEPLOY_WEBHOOK_URL,DEPLOY_WEBHOOK_TOKEN,CONTACT_EMAIL_TO
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8055/server/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  database:
  uploads:
