# Directus in production (Coolify, Docker Compose build pack, base directory `/directus`).
# The values come from the variables set in Coolify; SERVICE_* are generated by Coolify.
# PostgreSQL is a Coolify database of its own (`directus-postgres`), for Coolify's nightly backups:
# the app reaches it on the `coolify` network ("Connect to predefined network" on).
services:
  directus:
    build: .
    volumes:
      - uploads:/directus/uploads
    environment:
      SERVICE_FQDN_DIRECTUS_8055: ""
      PUBLIC_URL: ${SERVICE_URL_DIRECTUS}
      SECRET: ${SERVICE_BASE64_64_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      DB_CLIENT: pg
      # the database's internal hostname (its uuid in Coolify) and credentials
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ENABLED: "true"
      # the site's domains, comma-separated
      CORS_ORIGIN: ${CORS_ORIGIN}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-info@leicaflorianrobert.dev}
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
      DEPLOY_WEBHOOK_TOKEN: ${DEPLOY_WEBHOOK_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@leicaflorianrobert.dev}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-sendmail}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-2525}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      # crawlers may read it, to see the noindex header (extensions/noindex-hook)
      ROBOTS_TXT: "User-agent: *\nAllow: /\n"
      # the variables flows can read with {{ $env.NAME }}; the deploy webhook is read by extensions/rebuild-hook
      FLOWS_ENV_ALLOW_LIST: CONTACT_EMAIL_TO
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8055/server/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backup of the uploaded files, which Coolify doesn't back up (it does only databases): at start
  # and then every 24 hours, the originals (not the `__` resized copies, which Directus redoes)
  # go to the Space. Files deleted or replaced in Directus are kept in deleted/<date>.
  # SPACES_KEY and SPACES_SECRET: a Spaces access key, set in Coolify.
  uploads-backup:
    image: rclone/rclone:1.68.2
    volumes:
      - uploads:/uploads:ro
    environment:
      RCLONE_CONFIG_SPACE_TYPE: s3
      RCLONE_CONFIG_SPACE_PROVIDER: DigitalOcean
      RCLONE_CONFIG_SPACE_ENDPOINT: ams3.digitaloceanspaces.com
      RCLONE_CONFIG_SPACE_ACCESS_KEY_ID: ${SPACES_KEY:-}
      RCLONE_CONFIG_SPACE_SECRET_ACCESS_KEY: ${SPACES_SECRET:-}
      TARGET: ${UPLOADS_BACKUP_TARGET:-space:family-manager/backups/directus-v3/uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -z "$$RCLONE_CONFIG_SPACE_ACCESS_KEY_ID" ]; then
            echo "uploads backup: SPACES_KEY is not set"
          else
            rclone sync /uploads "$$TARGET/current" --exclude "*__*" --backup-dir "$$TARGET/deleted/$$(date +%F)" --stats-one-line -v \
              && echo "uploads backup: done $$(date)" || echo "uploads backup: FAILED $$(date)"
          fi
          sleep 86400
        done

volumes:
  uploads:
