# Serves the generated site: `/en/cv` is `/en/cv/index.html`, unknown paths get Nuxt's 404 page.
# Also redirects the addresses of the V2, which used to live on this domain.
server {
  listen 80;
  root /usr/share/nginx/html;
  # behind Coolify's proxy: redirects keep the visitor's scheme and host
  absolute_redirect off;

  location / {
    try_files $uri $uri/index.html =404;
  }

  # the V2 pages (Laravel, routes/web.php) at their V3 address
  location = /about { return 301 /chi-sono; }
  location = /projects { return 301 /progetti; }
  location = /cookie_policy { return 301 /privacy; }
  location = /privacy_policy { return 301 /privacy; }

  # the rest of the V2 lives on, archived: its admin, sign-in and files (the social banner too)
  location ~ ^/(admin|login|logout|register|forgot-password|reset-password|confirm-password|verify-email|img|storage|build)(/|$) {
    return 301 https://v2.leicaflorianrobert.dev$request_uri;
  }

  # hashed file names: they never change
  location /_nuxt/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
